name: Keep Alive Render & MongoDB

on:
  schedule:
    # Runs every 14 minutes to prevent Render 15-min free sleep & MongoDB Atlas pause
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL="https://expense-management-v9yf.onrender.com"
          fi
          echo "Pinging $BACKEND_URL/health ..."
          curl -sS -m 30 "$BACKEND_URL/health" || echo "Ping attempted."
